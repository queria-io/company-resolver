name: Apply

on:
  push:
    branches: [main]
    paths-ignore:
      - "worker/**" # Worker の変更ではデータを作り直さない
  schedule:
    - cron: "0 21 2 * *" # 法人番号のデータセットの月次の更新を受けて作り直す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@f89cad790a98fd7ee528dcdb13cb1b2fb6a8b964
    with:
      dataset_name: company_resolver
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # 正引きの索引は Worker の静的アセットに入る (worker/scripts/build-data.mjs)。Sync で main が進んだら、
  # Workers Builds の deploy hook で Worker をビルドし直してデプロイする
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.WORKERS_DEPLOY_HOOK_URL }}
