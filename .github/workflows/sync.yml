name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "worker/**" # Worker の変更ではデータを作り直さない
  schedule:
    - cron: "0 21 2 * *" # 法人番号のデータセットの月次の更新を受けて作り直す
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う
    permissions:
      contents: read
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@fe59be721647d5b1bbffe1ef3eb2d318c81be3f3
    with:
      dataset_name: company_resolver
    secrets:
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # 正引きの索引は Worker の静的アセットに入る (worker/scripts/build-data.mjs)。Sync で main が進んだら、
  # Workers Builds の deploy hook で Worker をビルドし直してデプロイする
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.WORKERS_DEPLOY_HOOK_URL }}
