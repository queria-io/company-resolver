name: "company_resolver"
version: "1.0.0"

profile: "company_resolver"

model-paths: ["models"]
macro-paths: ["macros", "shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# 逆引きの Worker (worker/src/reverse.ts) は DuckLake のカタログを読まず、ここで書いた Parquet を直接読む。
# 正引きの表は scripts/sync_d1.py が D1 に入れる。
# 表はまるごと作り直す (incremental にすると削除ファイルができ、Parquet だけを読む Worker が消した行を返す)。
# 行グループの大きさはスキーマに付ける (dbt は __dbt_tmp に書いてから改名するので、テーブルに付けても効かない)。
# 大きさは DuckDB が並列に書く単位 (122,880 行) を割り切るものにする。DuckDB はベクトル (2,048 行) より
# 小さい行グループを書かないので、2,048 行が最小
models:
  company_resolver:
    +database: company_resolver
    +materialized: table
    # 商号を NFKC で正規化した表 (Python のモデル)。DuckLake のカタログを書き換える pre-hook を付けない
    # (pre-hook の書き換えが確定する前に、Python のモデルが別の接続でカタログに書いて「database is locked」になる)
    names:
      +schema: forward
    # 正引き (/v1/forward)。scripts/sync_d1.py が D1 に入れる
    forward:
      +schema: forward
      +pre-hook:
        - "CREATE SCHEMA IF NOT EXISTS company_resolver.forward"
        - "CALL company_resolver.set_option('parquet_compression', 'zstd', schema => 'forward')"
    # 逆引き (/v1/reverse)。法人番号の下 3 桁 (shard) ごとにファイルを分ける
    reverse:
      +schema: reverse
      +pre-hook:
        - "CREATE SCHEMA IF NOT EXISTS company_resolver.reverse"
        - "CALL company_resolver.set_option('parquet_row_group_size', 2048, schema => 'reverse')"
        - "CALL company_resolver.set_option('parquet_compression', 'zstd', schema => 'reverse')"
      # 分けて書くテーブルは 1 スレッドで書き、書き出しの区切りを行グループの倍数にして、入力の並びを保つ
      # (並列に書くと並びが崩れ、1 つの法人番号の範囲が多くの行グループに散る)
      company:
        +partitioned_by: shard
        +pre-hook:
          - "SET threads = 1"
          - "SET partitioned_write_flush_threshold = 491520"
        +post-hook:
          - "RESET threads"
          - "RESET partitioned_write_flush_threshold"
