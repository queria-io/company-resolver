version: 2

models:
  - name: company_name
    description: |
      現存する法人の商号を NFKC で正規化したものと、本店所在地の市区町村です。正引きの索引の元になります。
      「国税庁法人番号公表サイト」（国税庁）（https://www.houjin-bangou.nta.go.jp/）を加工して作成。
    access: public
    columns:
      - name: corporate_number
        data_type: varchar
      - name: name
        data_type: varchar
      - name: prefecture_name
        data_type: varchar
      - name: city_name
        data_type: varchar
      - name: lg_code
        data_type: varchar
