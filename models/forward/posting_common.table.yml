schema: forward
name: posting_common
title: bigram 索引（出現が多いもの）
description: |-
  出現する法人が 10,000 を超える bigram ごとの法人の一覧です。商号を 2 文字ずつに分けた並び（bigram）で、近い商号の法人を住所の市区町村の中で検索するのに使います。

  - common_id と bucket ごとにファイルを分けています
keywords:
  - 法人番号
sources:
  - path: https://www.houjin-bangou.nta.go.jp/
fields:
  - name: common_id
    title: bigram の番号
    description: "gram の common_id"
  - name: bucket
    title: 市区町村の区分
    description: "lg_code を 64 で割った余り"
  - name: g
    title: bigram
  - name: lg_code
    title: 全国地方公共団体コード
    description: "本店所在地の市区町村"
  - name: corporate_number
    title: 法人番号
  - name: legal_form
    title: 法人格
    description: "株式会社・有限会社・合同会社・合資会社・合名会社。それ以外は NULL"
  - name: core
    title: 商号の本体
    description: "法人格などを除いて正規化した商号"
  - name: name
    title: 商号
    description: "NFKC で正規化した商号"
