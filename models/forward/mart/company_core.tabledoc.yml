title: 法人の商号の本体
description: |-
  現存する法人ごとの、正規化した商号の本体・法人格・本店所在地の市区町村・商号です。法人格と空白・中黒・ハイフン類を除き、英字を大文字に、小書きの仮名を大きい仮名に正規化した商号の本体で、同じ商号の法人を引くのに使います。

  - 旧商号を持つ法人は、旧商号の本体・法人格の行も持ちます。その行の商号・市区町村は今のもので、旧商号は former にあります。本体と法人格が今の商号と同じ旧商号の行は持ちません
  - 商号の本体が空になる法人は含みません
