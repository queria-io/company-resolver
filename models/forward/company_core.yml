version: 2

models:
  - name: company_core
    description: |
      現存する法人ごとの、正規化した商号の本体・法人格・本店所在地の市区町村・商号です。法人格と空白・中黒・ハイフン類を除き、英字を大文字に、小書きの仮名を大きい仮名に正規化した商号の本体で、同じ商号の法人を引くのに使います。
      「国税庁法人番号公表サイト」（国税庁）（https://www.houjin-bangou.nta.go.jp/）を加工して作成。
    access: public
    columns:
      - name: corporate_number
        data_type: varchar
      - name: core
        data_type: varchar
      - name: legal_form
        data_type: varchar
      - name: lg_code
        data_type: varchar
      - name: name
        data_type: varchar
