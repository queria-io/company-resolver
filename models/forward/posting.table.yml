schema: forward
name: posting
title: 商号の bigram 索引
description: |-
  商号を 2 文字ずつに分けた並び（bigram）ごとの法人の一覧です。法人格と空白・中黒・ハイフン類を除き、英字を大文字に、小書きの仮名を大きい仮名に正規化した商号から作ります。

  - shard（bigram の文字のコードポイントの和を 1,024 で割った余り）ごとにファイルを分け、bigram と lg_code の順に並べています
